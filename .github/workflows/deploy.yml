name: Deploy CorporateGuild Multi-Instance Cluster to Oracle Cloud Always Free

# ==============================================================================
# CorporateGuild - Automated Production Deployment CI/CD Workflow (2-VM Cluster)
# ==============================================================================
# Triggered automatically on push to 'master' branch or manual workflow dispatch.
# Automatically updates and synchronizes both nodes in the 2-VM topology:
#   - VM 1: Web Gateway (Caddy SSL Reverse Proxy + FastAPI Backend + Telemetry)
#   - VM 2: Worker Node (Redis 7 In-Memory Cache + ATS Ingestion + Heartbeat)
# ==============================================================================

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-gateway:
    name: Production Deployment to Gateway Node (VM 1)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Deployment on Oracle VM 1 (Gateway)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_VM_HOST }}
          username: ${{ secrets.OCI_VM_USER || 'ubuntu' }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || 22 }}
          script_stop: true
          envs: GITHUB_SHA
          script: |
            echo "======================================================================"
            echo "🚀 Starting CorporateGuild Gateway Deployment on VM 1: ${GITHUB_SHA::7}"
            echo "======================================================================"

            # 1. Target Directory Detection
            APP_DIR="/home/$(whoami)/iamrj846.github.io"
            if [ ! -d "$APP_DIR" ]; then
              APP_DIR="/opt/corporateguild"
            fi

            if [ ! -d "$APP_DIR" ]; then
              echo "❌ Error: Application directory not found at $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"
            echo "📂 Working directory on VM 1: $(pwd)"

            # 2. Pull Latest Changes from master
            echo "📥 Pulling latest commits from GitHub master branch..."
            git fetch origin master
            git checkout . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            git reset --hard origin/master

            # 3. Ensure permissions on scripts
            chmod +x scripts/*.sh scripts/*.py 2>/dev/null || true

            # 4. Build and Launch Containers via Docker Compose
            echo "🐳 Building and spinning up production containers on VM 1..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            # 5. Prune dangling/untagged Docker images to preserve disk space
            echo "🧹 Cleaning unused Docker build cache..."
            docker image prune -f

            # 6. Verify Container Health
            echo "🩺 Running post-deployment health check..."
            sleep 10
            docker compose -f docker-compose.prod.yml ps

            # Verify endpoint returns valid JSON
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 http://127.0.0.1:8000/api/health || echo "000")
            echo "Healthcheck status: HTTP $HEALTH"
            if [ "$HEALTH" -ne 200 ]; then
              echo "⚠️ Warning: Web service returned unexpected status $HEALTH during health check"
            else
              echo "✅ Gateway web service is healthy and responding!"
            fi

            echo "======================================================================"
            echo "🎉 VM 1 (Gateway Node) Deployment completed successfully!"
            echo "======================================================================"

  deploy-worker:
    name: Production Deployment to Worker Node (VM 2)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check VM 2 Configuration
        id: check_vm2
        env:
          VM2_HOST: ${{ secrets.OCI_VM2_HOST || secrets.VM2_HOST || secrets.OCI_VM_HOST_2 || secrets.WORKER_HOST || '129.225.92.91' }}
        run: |
          echo "configured=true" >> $GITHUB_OUTPUT
          echo "host=$VM2_HOST" >> $GITHUB_OUTPUT
          echo "✅ VM 2 Target Host: $VM2_HOST"

      - name: Execute Remote SSH Deployment on Oracle VM 2 (Worker)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.check_vm2.outputs.host }}
          username: ${{ secrets.OCI_VM2_USER || secrets.OCI_VM_USER || 'ubuntu' }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || 22 }}
          script_stop: true
          envs: GITHUB_SHA
          script: |
            echo "======================================================================"
            echo "🚀 Starting CorporateGuild Worker Deployment on VM 2: ${GITHUB_SHA::7}"
            echo "======================================================================"

            # 1. Target Directory Detection
            APP_DIR="/home/$(whoami)/iamrj846.github.io"
            if [ ! -d "$APP_DIR" ]; then
              APP_DIR="/opt/corporateguild"
            fi

            if [ ! -d "$APP_DIR" ]; then
              echo "❌ Error: Application directory not found at $APP_DIR on VM 2"
              exit 1
            fi

            cd "$APP_DIR"
            echo "📂 Working directory on VM 2: $(pwd)"

            # 2. Pull Latest Changes from master
            echo "📥 Pulling latest commits from GitHub master branch..."
            git fetch origin master
            git checkout . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            git reset --hard origin/master

            # 3. Ensure permissions on scripts
            chmod +x scripts/*.sh scripts/*.py 2>/dev/null || true

            # 4. Spin up or update Worker containers
            if [ -f "docker-compose.worker.yml" ]; then
              echo "🐳 Updating Worker Docker stack..."
              docker compose -f docker-compose.worker.yml up -d --remove-orphans
              docker restart corporateguild_web_worker 2>/dev/null || true
            elif [ -f "docker-compose.prod.yml" ]; then
              echo "🐳 Updating Redis container..."
              docker compose -f docker-compose.prod.yml up -d --remove-orphans redis
            fi

            # 5. Clean Docker cache
            docker image prune -f

            # 6. Restart Heartbeat telemetry daemon if active
            if systemctl is-active --quiet corporateguild-heartbeat; then
              echo "💓 Restarting worker telemetry heartbeat..."
              sudo systemctl restart corporateguild-heartbeat
            fi

            echo "======================================================================"
            echo "🎉 VM 2 (Worker Node) Deployment completed successfully!"
            echo "======================================================================"
