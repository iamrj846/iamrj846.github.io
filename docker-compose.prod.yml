# ==============================================================================
# CorporateGuild - Production Docker Compose Configuration (Oracle Cloud VM)
# ==============================================================================
# Services:
#   1. web: FastAPI + Uvicorn Application Container
#   2. redis: Redis 7 In-Memory Cache with AOF/RDB Persistence
#   3. caddy: Reverse Proxy with Automated Let's Encrypt TLS / SSL
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corporateguild_web_prod
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - APP_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_PATH=/app/data/jobs_portal.db
      - TZ=Asia/Kolkata
      - SYNC_INTERVAL_MINUTES=10
    env_file:
      - .env.prod
    volumes:
      # Persistent SQLite DB and application logs
      - ./data:/app/data
      - ./logs:/app/logs
      - ./resources:/app/resources
      - ./.env.prod:/app/.env.prod:ro
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/auth/me"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: corporateguild_redis_prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "900", "1", "--save", "300", "10"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    container_name: corporateguild_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # Stores Let's Encrypt certificates & keys
      - caddy_config:/config   # Caddy runtime state
    depends_on:
      - web

volumes:
  redis_prod_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
