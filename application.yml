app:
  name: "CorporateGuild Job Search Portal"
  environment: "development"
  host: "0.0.0.0"
  port: 8000
  debug: true
  timezone: "Asia/Kolkata"
  cookie_secret: "corporateguild-secret-jwt-key-2026-prod"

resources:
  excel_path: "resources/job_urls.xlsx"
  master_sheet: "Master ATS Directory (1000+)"
  greenhouse_sheet: "Greenhouse Endpoints"
  ashby_sheet: "Ashby Endpoints"
  smartrecruiters_sheet: "SmartRecruiters Endpoints"
  header_row_index: 3
  columns:
    index: 0
    company_name: 1
    ats_platform: 2
    http_method: 3
    api_endpoint: 4
    authentication: 5
    schema_notes: 6

redis:
  host: "127.0.0.1"
  port: 6379
  db: 0
  password: null
  ttl_seconds: 604800 # 7 days
  stale_cleanup_days: 7
  cluster_enabled: false

database:
  engine: "sqlite"
  path: "data/jobs_portal.db"
  url: "sqlite:///./data/jobs_portal.db"
  echo: false

admin:
  dashboard_url: "/admin-dashboard"
  username: "iamrj846"
  password_hash: "$2b$12$6zI1U7w8uNq18s9vQ2t02.aG2s4j3W5b8C7k9D0e1F2g3H4i5J6K7"
  plain_password_fallback: "iamrj846"

scheduler:
  sync_interval_minutes: 10
  lookback_minutes: 10
  initial_prepopulation_days: 7
  max_concurrent_requests: 15
  request_timeout_seconds: 10
  max_retries: 3
  backoff_factor: 1.5

guest:
  free_search_limit: 5
