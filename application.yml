app:
  name: "CorporateGuild Job Search Portal"
  environment: "development"
  host: "0.0.0.0"
  port: 8000
  debug: true
  timezone: "Asia/Kolkata"
  cookie_secret: ""

resources:
  excel_path: "resources/job_urls.xlsx"
  master_sheet: "Master ATS Directory (1000+)"
  greenhouse_sheet: "Greenhouse Endpoints"
  ashby_sheet: "Ashby Endpoints"
  smartrecruiters_sheet: "SmartRecruiters Endpoints"
  lever_sheet: "Lever Endpoints"
  bamboohr_sheet: "BambooHR Endpoints"
  header_row_index: 3
  columns:
    index: 0
    company_name: 1
    ats_platform: 2
    http_method: 3
    api_endpoint: 4
    authentication: 5
    schema_notes: 6

redis:
  host: "127.0.0.1"
  port: 6379
  db: 0
  password: null
  ttl_seconds: 2592000 # 30 days
  stale_cleanup_days: 30
  cluster_enabled: false

database:
  engine: "sqlite"
  path: "data/jobs_portal.db"
  url: "sqlite:///./data/jobs_portal.db"
  echo: false

admin:
  dashboard_url: "/admin-dashboard"
  username: "admin"
  password_hash: ""
  plain_password_fallback: ""

scheduler:
  sync_interval_minutes: 30
  lookback_minutes: 30
  initial_prepopulation_days: 7
  max_concurrent_requests: 12
  request_timeout_seconds: 10
  max_retries: 3
  backoff_factor: 1.5

guest:
  free_search_limit: 5

smtp:
  host: "smtp.zoho.in"
  port: 465
  user: ""
  password: ""
  from_email: "CorporateGuild <support@corporateguild.com>"
  use_tls: false
